plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.wificontrol'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.wificontrol'
        minSdk 26
        // Android 10 took Wi-Fi switching and joining away from apps that target it; this one only exists to keep them.
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published. The launcher's own build signs with the same key.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
